name: ui plugin

# The whole repo is one plugin, so there is no path filter to get wrong: any push
# or PR here touches ui.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No 5dive and no box: the suite writes its own fixture board and drives
      # the real bin/ui as a subprocess. Its two parity-against-core arms skip
      # themselves here by design.
      - name: ui plugin harness
        run: bash tests/ui_plugin_unit.sh
      # The control. A port's suite is the easiest place to write arms that
      # cannot fail, so the mutants run on every push too.
      - name: mutants
        run: bash tests/ui_mutants.sh
      # A manifest that does not parse breaks `5dive plugin add` at install
      # time, where nobody is watching.
      - name: manifests parse
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . ui/.claude-plugin/plugin.json > /dev/null
      # Contract §1: the manifest name must equal its folder name, and the
      # marketplace `source` must name that same folder. Getting this wrong is
      # invisible until an install fails rc=3 on a box (DIVE-4386, trap D).
      - name: manifest name matches its folder and the marketplace source
        run: |
          test "$(jq -r .name ui/.claude-plugin/plugin.json)" = ui
          test "$(jq -r '.plugins[]|select(.name=="ui")|.source' .claude-plugin/marketplace.json)" = ./ui
      # The verb resolves to <plugin>/bin/<verb>, and it must be executable in
      # the tree, not made executable by the installer.
      - name: the verb entry point is present and executable
        run: test -x ui/bin/ui
